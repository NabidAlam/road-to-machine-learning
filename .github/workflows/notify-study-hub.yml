# Notify the Study Hub repo to re-sync when curriculum changes on main.
#
# Currently manual-only: auto-dispatch was failing (token missing access to the
# private NabidInMotion hub). You already bump the submodule by hand when needed.
#
# To re-enable on push after rotating the PAT:
# 1. Fine-grained PAT with Contents read/write on NabidInMotion/nabidinmotion.github.io
# 2. Secret STUDY_HUB_DISPATCH_TOKEN = <PAT>
# 3. Variable STUDY_HUB_REPO = NabidInMotion/nabidinmotion.github.io
# 4. Restore the `push:` trigger below (and remove workflow_dispatch-only).

name: Notify study hub

on:
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger study hub sync
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.STUDY_HUB_DISPATCH_TOKEN }}
          repository: ${{ vars.STUDY_HUB_REPO }}
          event-type: curriculum-updated
