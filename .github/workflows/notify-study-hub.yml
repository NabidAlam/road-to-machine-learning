# Notify the Study Hub repo to re-sync when curriculum changes on main.
#
# This file lives in road-to-machine-learning (independent repo), NOT in the study hub.
#
# Instant sync is OPTIONAL. Without secrets, hub still syncs via daily cron or manual
# "Sync curriculum" on NabidInMotion/nabidinmotion.github.io.
#
# Least-privilege setup (one time):
# 1. Create a fine-grained PAT with access ONLY to NabidInMotion/nabidinmotion.github.io
#    (not All repositories, not classic all-repo PAT, not Polar/factory tokens).
# 2. In this repo → Settings → Secrets → Actions:
#      STUDY_HUB_DISPATCH_TOKEN = <that PAT>
# 3. In this repo → Settings → Variables → Actions:
#      STUDY_HUB_REPO = NabidInMotion/nabidinmotion.github.io
# 4. Push this workflow on main. Operator runbook (hub, gitignored):
#      .cursor/docs/SECURITY-SYNC-PAT.md
#
# After that, every push to main that changes *.md triggers Sync curriculum in the study hub
# (opens/updates PR sync/curriculum). Humans merge. Do not auto-merge.

name: Notify study hub

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "!.github/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger study hub sync
        # peter-evans/repository-dispatch@v4.0.1 (pinned SHA for supply-chain hygiene)
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.STUDY_HUB_DISPATCH_TOKEN }}
          repository: ${{ vars.STUDY_HUB_REPO }}
          event-type: curriculum-updated
